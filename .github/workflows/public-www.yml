# Builds the site with Astro and deploys dist/ to GitHub Pages (Pages source:
# GitHub Actions). Each build is also committed to the `public-www` branch on
# top of the previous one, so that branch keeps a history of releases.
# NOTE: this should be lounched from origin side
name: Publish public-www

on:
  push:
    branches: ["master"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: push public-www; pages, id-token: deploy to GitHub Pages.
permissions:
  contents: write
  pages: write
  deployments: write
  id-token: write

# One publish at a time; queued runs wait instead of cancelling a running one.
concurrency:
  group: "public-www"
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'apokaliptium/apokaliptium.online'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Browser checks skip themselves on GitHub Actions (tests/site.test.js),
      # so no Chromium is installed here. To run them again, remove their
      # skipIf and add: npx playwright install --with-deps chromium
      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build WebApp
        run: |
          npm run build
          cp CNAME dist/CNAME
          touch dist/.nojekyll

      - name: Publish to public-www
        run: |
          UNIXUSAT=$(node -e 'console.log(Date.now())')
          git config user.name "Mr. Crovley"
          git config user.email mr.crovley@skriptonus.apokryf.pl
          # Commit on top of the last release when the branch exists;
          # the first run starts the branch from the current commit.
          if git fetch --depth=1 origin public-www; then
            git reset --soft FETCH_HEAD
          fi
          git --work-tree dist add --all
          if git diff --cached --quiet; then
            echo "dist/ matches the last release; nothing to publish."
            exit 0
          fi
          # --no-verify: npm ci installs the husky hooks, which guard source
          # commits; this commit holds only built files.
          git commit --no-verify -m "Wellcome, wellcome, wellcome! looks like we have next release here... UNIXUSAT=${UNIXUSAT} we are currently."
          git push origin HEAD:public-www

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built site
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
