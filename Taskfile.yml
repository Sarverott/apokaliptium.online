# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GITRECON_BIN: gitrecon

includes:
  hooks:
    taskfile: .husky/Taskfile.yml
    dir: .

tasks:
  default:
    desc: List the available project procedures.
    cmds:
      - task --list

  check:
    desc: Check JavaScript and Python syntax and parse configuration.
    cmds:
      - npm run check
      - python3 -c 'import ast, pathlib; [ast.parse(path.read_text(), filename=str(path)) for path in pathlib.Path("scripts").glob("*.py")]'
      - python3 -c 'import json, pathlib, tomllib; json.loads(pathlib.Path("package.json").read_text()); json.loads(pathlib.Path("scripts/media.json").read_text()); tomllib.loads(pathlib.Path("pyproject.toml").read_text())'

  dev:
    desc: Run the Astro development server on localhost:4321.
    cmds:
      - npm run dev

  test:
    desc: Run Vitest, including the Playwright browser checks of the site.
    cmds:
      - npm test

  lint:
    desc: Lint and check formatting with Biome; nothing gets changed.
    cmds:
      - npm run lint

  audit:
    desc: Report known vulnerabilities in installed npm packages.
    cmds:
      - npm run audit

  inspect:
    desc: Crawl a running page with Crawlee and Playwright (default the dev server).
    cmds:
      - node scripts/inspect.mjs {{.CLI_ARGS}}

  serve:
    desc: Serve the existing static site on localhost:8000.
    cmds:
      - python3 -m http.server 8000 --bind 127.0.0.1

  media:plan:
    desc: Validate local media and print the upload plan without network access.
    cmds:
      - python3 scripts/media.py plan

  media:upload:
    desc: Upload media and verify public downloads; requires local write credentials.
    cmds:
      - uv run python scripts/media.py upload

  media:verify:
    desc: Verify anonymous public downloads against the media manifest.
    cmds:
      - python3 scripts/media.py verify

  recon:
    desc: Inspect the repository with gitrecon without saving to its datasets.
    cmds:
      - '"{{.GITRECON_BIN}}" analyze . --no-save --json'
